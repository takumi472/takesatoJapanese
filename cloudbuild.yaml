steps:
  # 1. Docker イメージのビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/decent-envoy-512013-j5/my-app-repo/takesato-japanese:$COMMIT_SHA'
      - '.'

  # 2. プッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/decent-envoy-512013-j5/my-app-repo/takesato-japanese:$COMMIT_SHA'

  # 3. Cloud Run デプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'takesato-japanese-service'
      - '--image=asia-northeast1-docker.pkg.dev/decent-envoy-512013-j5/my-app-repo/takesato-japanese:$COMMIT_SHA'
      - '--region=asia-northeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY