<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規受講生の登録＆学習記録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
            const s = document.createElement('script');
            s.src = "/_vercel/speed-insights/script.js";
            s.defer = true;
            document.head.appendChild(s);
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0ebf8; }
        .form-container { max-width: 740px; margin: 30px auto; }
        .card-question { background-color: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 24px; margin-bottom: 12px; }
        .required-star { color: #d93025; margin-left: 4px; }
        .preview-image { max-width: 150px; border: 1px solid #dadce0; border-radius: 8px; margin-bottom: 10px; display: none; }
        .sample-image-box { max-width: 150px; border: 1px dashed #ccc; padding: 10px; text-align: center; background-color: #f8f9fa; }
        /* 他の画面と統一したpage-headerスタイル */
        .page-header { background-color: #fff; border-top: 8px solid #673ab7; border-radius: 8px; padding: 24px; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .file-input-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; font-size: 100px; cursor: pointer; }
        /* Googleフォーム風の下線入力フィールドスタイル */
        .form-control-gf {
            width: 100%;
            border: none;
            border-bottom: 1px solid #dadce0;
            border-radius: 0;
            padding: 6px 0;
            background-color: transparent;
            color: #202124;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, border-width 0.1s ease;
        }
        .form-control-gf:focus {
            border-color: #673ab7;
            border-bottom: 2px solid #673ab7;
            padding-bottom: 5px;
        }

        /* ローディング画面のスタイル */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85); /* 半透明の白背景 */
            z-index: 9999; /* 最前面に表示 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none; /* 初期状態は非表示 */
        }
        .loading-spinner {
            width: 4rem;
            height: 4rem;
            color: #673ab7; /* テーマカラーに合わせる */
        }
        .loading-text {
            margin-top: 15px;
            color: #673ab7;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* モバイル向けスタイル調整 */
        .select-responsive {
            width: 100%;
            max-width: 320px;
        }
        @media (max-width: 576px) {
            .form-container {
                margin: 12px auto 24px auto;
                padding-left: 10px;
                padding-right: 10px;
            }
            .page-header {
                padding: 16px 14px;
                border-radius: 6px;
            }
            .card-question {
                padding: 16px 14px;
                margin-bottom: 10px;
                border-radius: 6px;
            }
            .select-responsive {
                max-width: 100%;
                font-size: 16px;
                padding: 10px 12px;
            }
            .form-control-gf, input[type=text], textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner-border loading-spinner" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="loading-text">送信中です...しばらくお待ちください</div>
</div>

<div class="container form-container">
    <div class="page-header mb-3 mb-sm-4 shadow-sm">
        <div class="d-flex align-items-start gap-2 gap-sm-3">
            <a href="{{ url_for('student.student_list') }}" class="btn btn-primary flex-shrink-0" style="background-color: #673ab7; border-color: #673ab7; padding: 6px 12px;" title="一覧へ戻る">
                <i class="bi bi-chevron-left"></i>
            </a>
            <div class="flex-grow-1 min-w-0">
                <h1 class="h5 fw-bold mb-1">新規受講生の登録＆学習記録</h1>
                <p class="text-muted mb-0 small" style="line-height: 1.45;">初めての受講生について、顔写真の撮影、受講生登録、本日の学習内容を入力してください。</p>
            </div>
        </div>
        <div class="text-end mt-2 pt-2 border-top">
            <span class="text-danger small fw-semibold">* 必須項目</span>
        </div>
    </div>

    <form id="registration-form" action="{{ url_for('student.create_student') }}" method="POST" enctype="multipart/form-data">
        <div class="card-question shadow-sm">
            <label class="form-label fw-bold">(1) 顔写真のアップロード <span class="text-muted fw-normal small">※スマホで受講生の顔写真を撮影し、アップロードしてください (最大10MB)</span></label>
            <div class="mb-3">
                <img id="image_preview" src="#" alt="プレビュー" class="preview-image">
                <div id="sample_box" class="sample-image-box mb-2 small text-muted"><span style="font-size: 2rem;">👤</span><br>顔写真の見本</div>
                <div class="file-input-wrapper">
                    <button type="button" class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-file-earmark-arrow-up"></i> 画像を選択
                    </button>
                    <input type="file" name="face_photo" id="face_photo_input" accept="image/*" {% if not staff %}required{% endif %}>
                </div>
                <span id="file_name_display" class="text-muted ms-2" style="font-size: 13px;"></span>
            </div>
        </div>

        <div class="card-question shadow-sm">
            <label for="student_name_kana" class="form-label fw-bold">(2) 受講生の氏名（カタカナ） <span class="required-star">*</span></label>
            <input type="text" class="form-control border-0 border-bottom rounded-0 px-0" id="student_name_kana" placeholder="ヤマダ タロウ" name="student_name_kana" required>
        </div>

        <div class="card-question shadow-sm">
            <label for="country_of_origin" class="form-label fw-bold">(3) 出身国 <span class="required-star">*</span></label>
            <input type="text" class="form-control border-0 border-bottom rounded-0 px-0" id="country_of_origin" name="country_of_origin" placeholder="回答を入力" required>
            <div id="country-feedback" class="small text-muted mt-1">国名を入力すると母語が自動入力されます</div>
        </div>

        <div class="card-question shadow-sm">
            <label for="native_language" class="form-label fw-bold">(4) 話す言葉（母語） <span class="required-star">*</span></label>
            <input type="text" class="form-control border-0 border-bottom rounded-0 px-0" id="native_language" name="native_language" placeholder="回答を入力" required>
        </div>

        <div class="card-question shadow-sm">
            <label for="other_languages" class="form-label fw-bold">(5) 話す言葉（母語以外）</label>
            <input type="text" class="form-control border-0 border-bottom rounded-0 px-0" id="other_languages" name="other_languages" placeholder="回答を入力">
        </div>

        <div class="card-question shadow-sm">
            <label for="occupation" class="form-label fw-bold">(6) 職業</label>
            <input type="text" class="form-control border-0 border-bottom rounded-0 px-0" id="occupation" name="occupation" placeholder="回答を入力">
        </div>

        <div class="card-question shadow-sm">
            <label for="region-select" class="form-label fw-bold">(7) 居住地域 <span class="required-star">*</span></label>
            <div class="mb-3">
                <div class="d-flex align-items-center gap-2">
                    <input type="text" id="area-search" class="form-control-gf flex-grow-1" placeholder="🔍 市区町村名や町名で検索 (例: 春日部市大場、武里、谷原)">
                    <button type="button" id="btn-area-search" class="btn btn-sm btn-outline-primary text-nowrap">検索</button>
                </div>
                <div id="search-feedback" class="small text-muted mt-1">町名や市区町村名を入力してEnter（または検索ボタン）を押すと該当地域を自動選択します</div>
            </div>
            <div class="row g-2">
                <div class="col-md-4">
                    <select id="region-select" class="form-select">
                        <option value="">地方を選択</option>
                        {% for region in region_data.keys() %}
                        <option value="{{ region }}">{{ region }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="pref-select" class="form-select" disabled>
                        <option value="">都道府県を選択</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="city-select" name="residential_area" class="form-select" disabled required>
                        <option value="">市区町村を選択</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card-question shadow-sm">
            <label for="jlpt_level" class="form-label fw-bold">(8) 日本語能力試験（JLPT）取得レベル <span class="required-star">*</span></label>
            <select class="form-select select-responsive" id="jlpt_level" name="jlpt_level" required>
                <option value="" selected disabled>選択</option>
                <option value="N1">N1</option>
                <option value="N2">N2</option>
                <option value="N3">N3</option>
                <option value="N4">N4</option>
                <option value="N5">N5</option>
                <option value="なし">なし</option>
            </select>
        </div>

        <div class="card-question shadow-sm">
            <label for="learning_purpose" class="form-label fw-bold">(9) 日本語学習の目的、目標、期限</label>
            <textarea class="form-control border-0 border-bottom rounded-0 px-0" id="learning_purpose" name="learning_purpose" rows="2" placeholder="回答を入力"></textarea>
        </div>

        <div class="card-question shadow-sm">
            <label for="life_troubles" class="form-label fw-bold">(10) 現在、生活で困っていること、わからない事</label>
            <textarea class="form-control border-0 border-bottom rounded-0 px-0" id="life_troubles" name="life_troubles" rows="2" placeholder="回答を入力"></textarea>
        </div>

        <div class="card-question shadow-sm">
            <label for="how_knew_class" class="form-label fw-bold">(11) どうやってこの日本語教室を知りましたか？ <span class="required-star">*</span></label>
            <select class="form-select select-responsive" id="how_knew_class" name="how_knew_class" required>
                <option value="" selected disabled>選択</option>
                <option value="知人の紹介">知人の紹介</option>
                <option value="GoogleMap">GoogleMap</option>
                <option value="SNS・インターネット">SNS・インターネット</option>
                <option value="市役所">市役所</option>
                <option value="武里団地のチラシ・ポスター">武里団地のチラシ・ポスター</option>
                <option value="その他">その他</option>
            </select>
        </div>

        <div class="card-question shadow-sm">
            <label for="how_knew_class_other" class="form-label fw-bold">(12) 上の(11)で「その他」を選んだ方は具体的に、どこでこの武里日本語教室を知ったか記入してください。</label>
            <input type="text" class="form-control border-0 border-bottom rounded-0 px-0" id="how_knew_class_other" name="how_knew_class_other" placeholder="回答を入力">
        </div>

        <div class="card-question shadow-sm">
            <label for="staff_in_charge" class="form-label fw-bold">(13) 記入担当者 <span class="required-star">*</span></label>
            <select class="form-select select-responsive" id="staff_in_charge" name="staff_in_charge" required>
                <option value="" selected disabled>選択</option>
                {% for staff in staff_list %}
            <option value="{{ staff.id }}">{{ staff.last_name_kanji | decrypt }}</option>
        {% endfor %}
            </select>
        </div>

        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-2 mb-5">
            <button type="submit" class="btn text-white py-2 px-4 fw-bold order-1 order-sm-0" style="background-color: #673ab7;">送信</button>
            <div class="d-flex gap-2 order-2 order-sm-1">
                <a href="{{ url_for('student.student_list') }}" class="btn text-white py-2 px-4 fw-bold flex-fill text-center" style="background-color: #673ab7;" title="生徒一覧へ戻る">
                    戻る
                </a>
                <button type="reset" class="btn text-white py-2 px-4 fw-bold flex-fill" style="background-color: #673ab7;">クリア</button>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- ローディング画面の表示処理 ---
    document.getElementById('registration-form').addEventListener('submit', function(event) {
        // 必須項目などが正しく入力されているかチェック (HTML5 Validation)
        if (this.checkValidity()) {
            // バリデーションOKならローディング画面を表示
            document.getElementById('loading-overlay').style.display = 'flex';
        }
    });

    document.getElementById('face_photo_input').onchange = function (evt) {
        const [file] = this.files;
        const preview = document.getElementById('image_preview');
        const sampleBox = document.getElementById('sample_box');
        const filenameDisplay = document.getElementById('file_name_display');
        if (file) {
            filenameDisplay.textContent = file.name;
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            sampleBox.style.display = 'none';
        } else {
            filenameDisplay.textContent = '';
            preview.style.display = 'none';
            sampleBox.style.display = 'block';
        }
    };

    const regionData = {{ region_data | tojson }};
    const regionSelect = document.getElementById('region-select');
    const prefSelect = document.getElementById('pref-select');
    const citySelect = document.getElementById('city-select');

    // 既存の階層プルダウンのロジック
    regionSelect.addEventListener('change', function() {
        const region = this.value;
        prefSelect.innerHTML = '<option value="">都道府県を選択</option>';
        citySelect.innerHTML = '<option value="">市区町村を選択</option>';
        prefSelect.disabled = true;
        citySelect.disabled = true;

        if (region && regionData[region]) {
            Object.keys(regionData[region]).forEach(pref => {
                const opt = document.createElement('option');
                opt.value = pref;
                opt.textContent = pref;
                prefSelect.appendChild(opt);
            });
            prefSelect.disabled = false;
        }
    });

    prefSelect.addEventListener('change', function() {
        const region = regionSelect.value;
        const pref = this.value;
        citySelect.innerHTML = '<option value="">市区町村を選択</option>';
        citySelect.disabled = true;

        if (region && pref && regionData[region][pref]) {
            regionData[region][pref].forEach(city => {
                const opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                citySelect.appendChild(opt);
            });
            citySelect.disabled = false;
        }
    });

    function updateDropdownsFromAddress(prefecture, city) {
        let foundRegion = null;
        for (const region in regionData) {
            if (regionData[region][prefecture]) {
                foundRegion = region;
                break;
            }
        }

        if (foundRegion) {
            regionSelect.value = foundRegion;
            regionSelect.dispatchEvent(new Event('change')); // 都道府県リストを更新

            prefSelect.value = prefecture;
            prefSelect.dispatchEvent(new Event('change')); // 市区町村リストを更新

            citySelect.value = city;
            citySelect.focus();
            citySelect.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            alert(`「${prefecture}」または「${city}」は定義された地域データに見つかりませんでした。手動で選択してください。`);
        }
    }

    // --- 居住地域のキーワード検索機能（市区町村名・町名対応） ---
    const areaSearchInput = document.getElementById('area-search');
    const areaSearchBtn = document.getElementById('btn-area-search');
    const searchFeedback = document.getElementById('search-feedback');

    // 都道府県名から地方名を逆引きする関数
    function findRegionByPref(prefecture) {
        for (const region in regionData) {
            if (regionData[region][prefecture]) return region;
        }
        return null;
    }

    // 住所文字列から都道府県名と最も詳細な市区町村・町名を抽出する
    function extractPrefAndCity(title) {
        if (!title) return null;
        for (const region in regionData) {
            for (const pref in regionData[region]) {
                if (title.includes(pref)) {
                    let bestCity = '';
                    for (const c of regionData[region][pref]) {
                        if (title.includes(c) && c.length > bestCity.length) {
                            bestCity = c;
                        }
                    }
                    if (bestCity) {
                        return { pref, city: bestCity };
                    }
                }
            }
        }
        for (const region in regionData) {
            for (const pref in regionData[region]) {
                let bestCity = '';
                for (const c of regionData[region][pref]) {
                    if (title.includes(c) && c.length > bestCity.length) {
                        bestCity = c;
                    }
                }
                if (bestCity) {
                    return { pref, city: bestCity };
                }
            }
        }
        return null;
    }

    // ローカルのregionDataから入力クエリに最も適した地域を高速探索する
    function findLocalMatch(q) {
        // 1. 完全一致（例: 「春日部市大場」「春日部市」）
        for (const region in regionData) {
            for (const pref in regionData[region]) {
                const exact = regionData[region][pref].find(c => c === q);
                if (exact) return { pref, city: exact };
            }
        }

        // 探索優先度リストの作成（クエリに都道府県名が含まれる場合はその都道府県最優先、次いで教室所在地の埼玉県、その他の順）
        const prefOrder = [];
        for (const region in regionData) {
            for (const pref in regionData[region]) {
                if (q.includes(pref)) {
                    prefOrder.unshift(pref);
                } else if (pref === '埼玉県') {
                    prefOrder.push(pref);
                }
            }
        }
        for (const region in regionData) {
            for (const pref in regionData[region]) {
                if (!prefOrder.includes(pref)) {
                    prefOrder.push(pref);
                }
            }
        }

        // 2. クエリが地域名を含んでいる場合（例: 「埼玉県春日部市大場1-2-3」→「春日部市大場」）
        // 最も長い一致（町名付き）を優先
        for (const pref of prefOrder) {
            const reg = findRegionByPref(pref);
            if (!reg) continue;
            let bestCity = '';
            for (const c of regionData[reg][pref]) {
                if (c.length >= 3 && q.includes(c) && c.length > bestCity.length) {
                    bestCity = c;
                }
            }
            if (bestCity) return { pref, city: bestCity };
        }

        // 3. 地域名がクエリを含んでいる場合（例: 「大場」→「春日部市大場」、「武里」→「春日部市武里中野」など）
        for (const pref of prefOrder) {
            const reg = findRegionByPref(pref);
            if (!reg) continue;
            const match = regionData[reg][pref].find(c => c.includes(q));
            if (match) return { pref, city: match };
        }

        return null;
    }

    async function performAreaSearch() {
        const query = areaSearchInput.value.trim();

        // 以前のフィードバックをクリアし、スタイルをリセット
        searchFeedback.textContent = '';
        searchFeedback.style.color = '#6c757d';

        if (query.length < 2) {
            searchFeedback.textContent = '2文字以上入力して検索してください';
            searchFeedback.style.color = '#6c757d';
            return;
        }

        // 1. ローカルデータでの高速マッチング
        const localMatch = findLocalMatch(query);
        if (localMatch) {
            updateDropdownsFromAddress(localMatch.pref, localMatch.city);
            searchFeedback.textContent = `✅ 「${localMatch.pref} ${localMatch.city}」を見つけて選択しました`;
            searchFeedback.style.color = '#198754';
            return;
        }

        // 2. ローカルで見つからない場合の国土地理院 住所検索APIフォールバック
        searchFeedback.textContent = `🔍 「${query}」を住所データベースで検索中...`;
        searchFeedback.style.color = '#0d6efd';

        try {
            const apiUrl = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(query)}`;
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error('Address API network error');
            }
            const data = await response.json();

            if (Array.isArray(data) && data.length > 0) {
                let bestMatch = null;
                for (const item of data) {
                    const title = item.properties?.title || '';
                    const match = extractPrefAndCity(title);
                    if (match) {
                        if (!bestMatch) {
                            bestMatch = { ...match, title };
                        }
                        if (match.pref === '埼玉県') {
                            bestMatch = { ...match, title };
                            break;
                        }
                    }
                }

                if (bestMatch) {
                    updateDropdownsFromAddress(bestMatch.pref, bestMatch.city);
                    searchFeedback.textContent = `✅ 「${query}」から「${bestMatch.pref} ${bestMatch.city}」を特定して選択しました（${bestMatch.title}）`;
                    searchFeedback.style.color = '#198754';
                    return;
                }
            }

            searchFeedback.textContent = `「${query}」に一致する市区町村・町名は見つかりませんでした。`;
            searchFeedback.style.color = '#dc3545';
        } catch (error) {
            console.error('住所検索エラー:', error);
            searchFeedback.textContent = `住所の自動検索に失敗しました。手動で選択してください。`;
            searchFeedback.style.color = '#dc3545';
        }
    }

    areaSearchInput.addEventListener('keydown', function(event) {
        // IME変換中（未確定）のEnterキー入力は無視する
        if (event.isComposing || event.keyCode === 229) {
            return;
        }
        if (event.key === 'Enter') {
            event.preventDefault(); // Enterキーによるフォーム送信などを防止
            performAreaSearch();
        }
    });

    if (areaSearchBtn) {
        areaSearchBtn.addEventListener('click', function() {
            performAreaSearch();
        });
    }

    // --- 出身国から母語を自動入力する機能 ---
    const motherLanguageData = {{ mother_language_data | default({}) | tojson }};
    const countryInput = document.getElementById('country_of_origin');
    const nativeLangInput = document.getElementById('native_language');

    countryInput.addEventListener('input', function() {
        const countryName = this.value.trim();
        if (motherLanguageData[countryName]) {
            // 複数の言語がある場合は「、」で繋いで表示
            nativeLangInput.value = motherLanguageData[countryName].join('、');
        }
    });
</script>
