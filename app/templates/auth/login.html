<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 武里日本語教室</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon-192.png') }}?v=1">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-192.png') }}">

    <meta name="theme-color" content="#673ab7">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /**
 * Takesato Japanese Class - Unified Design System Stylesheet
 * 武里日本語教室 共通スタイルシート
 */

:root {
    /* Brand & Theme Colors */
    --primary-color: #673ab7;
    --primary-hover: #512da8;
    --primary-light: #f0ebf8;
    --primary-rgb: 103, 58, 183;

    /* Semantic Colors */
    --success-color: #10b981;
    --success-hover: #059669;
    --danger-color: #d93025;
    --danger-hover: #b31412;
    --warning-color: #f59e0b;
    --info-color: #0284c7;

    /* Neutral & Background Colors */
    --bg-body: #f0ebf8;
    --bg-page: #f8f9fa;
    --bg-card: #ffffff;
    --text-main: #202124;
    --text-muted: #5f6368;
    --border-color: #dadce0;

    /* Spacing & Radii */
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-full: 50%;

    /* Transitions & Shadows */
    --transition-fast: all 0.2s ease;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

/* ==========================================================================
   Base Styles
   ========================================================================== */
body {
    background-color: var(--bg-body);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* Page Containers */
.main-container {
    max-width: 1000px;
    margin: 24px auto;
}

.dashboard-container {
    max-width: 1000px;
    margin: 20px auto;
}

.form-container {
    max-width: 740px;
    margin: 30px auto;
}

.login-container,
.auth-container {
    max-width: 450px;
    margin: 80px auto;
}

.login-card {
    background-color: var(--bg-card);
    border-top: 10px solid var(--primary-color);
    border-radius: var(--radius-md);
    padding: 30px;
}

/* ==========================================================================
   Header Components
   ========================================================================== */
.page-header,
.welcome-header,
.form-header {
    background-color: var(--bg-card);
    border-top: 8px solid var(--primary-color);
    border-radius: var(--radius-md);
    padding: 24px;
    box-shadow: var(--shadow-sm);
}

/* ==========================================================================
   Card Components
   ========================================================================== */
.form-card,
.card-question {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
}

.menu-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    transition: var(--transition-fast);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
}

.menu-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary-color);
    color: inherit;
}

.transition-card {
    transition: var(--transition-fast);
}

.transition-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md) !important;
}

/* ==========================================================================
   Form Controls & Elements
   ========================================================================== */
.form-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 8px;
    display: block;
}

.required-star {
    color: var(--danger-color);
    margin-left: 4px;
    font-weight: bold;
}

/* Google Forms styled underline input */
.form-control-gf {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--border-color);
    border-radius: 0;
    padding: 6px 0;
    background-color: transparent;
    color: var(--text-main);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease, border-width 0.1s ease;
}

.form-control-gf:focus {
    border-color: var(--primary-color);
    border-bottom: 2px solid var(--primary-color);
    padding-bottom: 5px;
}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn-submit,
.btn-primary-custom {
    background-color: var(--primary-color);
    color: #ffffff;
    font-weight: 600;
    padding: 9px 24px;
    border-radius: var(--radius-sm);
    border: none;
    transition: var(--transition-fast);
}

.btn-submit:hover,
.btn-primary-custom:hover {
    background-color: var(--primary-hover);
    color: #ffffff;
}

.btn-logout {
    color: var(--danger-color);
    text-decoration: none;
    font-size: 14px;
    border: 1px solid var(--danger-color);
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    transition: var(--transition-fast);
    font-weight: 500;
}

.btn-logout:hover {
    background-color: var(--danger-color);
    color: #ffffff !important;
}

/* Floating Action Button (戻るボタン) */
.btn-floating-back {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 56px;
    height: 56px;
    border-radius: var(--radius-full);
    background-color: var(--primary-color);
    color: #ffffff;
    z-index: 1050;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    transition: transform 0.2s, background-color 0.2s;
    text-decoration: none;
}

.btn-floating-back:hover {
    background-color: var(--primary-hover);
    transform: scale(1.08);
    color: #ffffff;
}

/* ==========================================================================
   Image & Photo Upload Components
   ========================================================================== */
.student-avatar {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
}

.staff-avatar {
    width: 80%;
    height: 80%;
    border-radius: var(--radius-full);
    object-fit: cover;
}

.staff-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    transition: var(--transition-fast);
    overflow: hidden;
}

.staff-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
}

.staff-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 4px;
}

.staff-info {
    font-size: 13px;
    color: var(--text-muted);
}

.btn-add-staff {
    background-color: var(--primary-color);
    color: #ffffff;
    font-weight: 500;
}

.btn-add-staff:hover {
    background-color: var(--primary-hover);
    color: #ffffff;
}

.avatar-container {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background-color: var(--bg-page);
    display: flex;
    align-items: center;
    justify-content: center;
}

.preview-zone,
.preview-image {
    max-width: 180px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
    padding: 4px;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
}

.preview-zone img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
}

.sample-image-box {
    max-width: 180px;
    border: 1px dashed #ccc;
    padding: 10px;
    text-align: center;
    background-color: var(--bg-page);
    border-radius: var(--radius-sm);
}

.file-input-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-block;
}

.file-input-wrapper input[type="file"] {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    font-size: 100px;
    cursor: pointer;
}

/* ==========================================================================
   Interactive & Utility Components
   ========================================================================== */
/* Sortable list styling */
.drag-handle {
    cursor: move;
    color: #adb5bd;
}

.sortable-ghost {
    background: #e9ecef;
    opacity: 0.7;
}

.sortable-drag {
    background-color: #ffffff;
}

/* Loading Overlay */
#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.88);
    z-index: 9999;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.loading-spinner {
    width: 3.5rem;
    height: 3.5rem;
    color: var(--primary-color);
}

.loading-text {
    margin-top: 16px;
    color: var(--primary-color);
    font-weight: 600;
    font-size: 1.05rem;
}

/* Dashboard specific helpers */
.icon-circle {
    width: 60px;
    height: 60px;
    background-color: var(--primary-light);
    color: var(--primary-color);
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 15px;
}

.count-badge {
    font-size: 14px;
    background-color: #e8f0fe;
    color: #1a73e8;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: bold;
}

.chart-container-pie {
    position: relative;
    height: 250px;
    width: 100%;
    display: flex;
    justify-content: center;
}

.manual-btn-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 6px 10px;
    text-decoration: none;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: var(--transition-fast);
}

.manual-btn-card:hover {
    box-shadow: var(--shadow-sm);
    border-color: #0d6efd;
    color: #0d6efd;
}

.manual-icon {
    width: 32px;
    height: 32px;
    background-color: #e7f3ff;
    color: #0d6efd;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

    </style>
</head>
<body>

<div class="container login-container">
    <div class="login-card shadow-sm">
        <h2 class="h4 text-center mb-4 fw-bold">武里日本語教室<br><span class="text-muted fs-6">管理システム</span></h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold">ユーザー名</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="フルネームローマ字「小文字」" required autocomplete="username">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold">パスワード</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn text-white fw-bold" style="background-color: #673ab7;">ログイン</button>
            </div>

            <div class="text-center mt-3 small">
                <a href="{{ url_for('auth.forgot_password') }}">パスワードを忘れた場合</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<footer class="text-center text-muted py-4 mt-5">
    <small>
        © 2026 TAKUMI DATA SYSTEMS. All Rights Reserved.<br>
        Designed & Built with ☕ by TAKUMI DATA SYSTEMS
    </small>
</footer>
</body>
</html>
