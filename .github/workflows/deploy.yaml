name: Build and Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main-gcp

permissions:
  contents: read
  id-token: write # Workload Identity Federation による認証に必須

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: GCP
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Workload Identity Federation を使用して Google Cloud に認証
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # 2. gcloud CLI のセットアップ
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. ルートにある cloudbuild.yaml を使用して Cloud Build を実行
      - name: Run Cloud Build
        run: |
          gcloud builds submit --config=cloudbuild.yaml .